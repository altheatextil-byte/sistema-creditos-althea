<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Enviada - Althea</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tarjeta {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            border-top: 6px solid #c9a05b;
        }
        h1 { color: #1a1a2e; }
        p { color: #666; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #c9a05b;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>✅ ¡Solicitud Enviada!</h1>
        <p>Gracias <strong>{{ nombre }}</strong>, hemos recibido tu solicitud de crédito.</p>
        <p>Nuestro equipo la revisará y se pondrá en contacto contigo pronto.</p>
        <a href="/" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
