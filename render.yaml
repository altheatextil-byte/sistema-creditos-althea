services:
  - type: web
    name: sistema-creditos-althea
    runtime: python
    plan: free
    region: oregon
    # El python -c hace fallar el build si el driver no quedó instalado,
    # en lugar de descubrirlo recién al arrancar gunicorn.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -c "import psycopg2; print('psycopg2 OK', psycopg2.__version__)"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      # Se pide una sola vez al crear el Blueprint; no queda escrita en el repo.
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: althea-db
          property: connectionString

databases:
  - name: althea-db
    plan: free
    region: oregon
    databaseName: althea
    user: althea
